name: Build RPS Context Variants
'on':
  workflow_dispatch: null
jobs:
  CI:
    strategy:
      fail-fast: false
      matrix:
        context:
        - tool: AC6
          dir: ./RockPaperScissors/AppKit-E8_USB
          proj: AlgorithmTest
          build-type: Debug
          target-type: AppKit-E8-U85
          artf_name: AC6_Debug_AppKit-E8-U85
        - tool: AC6
          dir: ./RockPaperScissors/AppKit-E8_USB
          proj: AlgorithmTest
          build-type: Debug
          target-type: AppKit-E8-U85
          artf_name: AC6_Debug_AppKit-E8-U85
        - tool: AC6
          dir: ./RockPaperScissors/AppKit-E8_USB
          proj: AlgorithmTest
          build-type: Release
          target-type: AppKit-E8-U85
          artf_name: AC6_Release_AppKit-E8-U85
        - tool: AC6
          dir: ./RockPaperScissors/AppKit-E8_USB
          proj: AlgorithmTest
          build-type: Release
          target-type: AppKit-E8-U85
          artf_name: AC6_Release_AppKit-E8-U85
        - tool: AC6
          dir: ./RockPaperScissors/AppKit-E8_USB
          proj: AlgorithmTest
          build-type: Debug
          target-type: SSE-320-U85
          artf_name: AC6_Debug_SSE-320-U85
        - tool: AC6
          dir: ./RockPaperScissors/AppKit-E8_USB
          proj: AlgorithmTest
          build-type: Debug
          target-type: SSE-320-U85
          artf_name: AC6_Debug_SSE-320-U85
        - tool: AC6
          dir: ./RockPaperScissors/AppKit-E8_USB
          proj: AlgorithmTest
          build-type: Release
          target-type: SSE-320-U85
          artf_name: AC6_Release_SSE-320-U85
        - tool: AC6
          dir: ./RockPaperScissors/AppKit-E8_USB
          proj: AlgorithmTest
          build-type: Release
          target-type: SSE-320-U85
          artf_name: AC6_Release_SSE-320-U85
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Activate vcpkg
      uses: ARM-software/cmsis-actions/vcpkg@v1
      with:
        config: ./vcpkg-configuration.json
    - name: Activate Arm tool license
      uses: ARM-software/cmsis-actions/armlm@v1
    - name: Initialize CMSIS pack root folder
      run: |
        cpackget init https://www.keil.com/pack/index.pidx
        cpackget update-index
    - name: Cache downloaded packs
      uses: actions/cache@v6
      with:
        key: ModelNova
        path: /home/runner/.cache/arm/packs/.Download
    - name: ${{matrix.context.tool}} Build-Test for context ${{matrix.context.proj}}.${{matrix.context.build-type}}+${{matrix.context.target-type}}
      working-directory: ${{matrix.context.dir}}
      run: |
        cbuild SDS.csolution.yml --context ${{matrix.context.proj}}.${{matrix.context.build-type}}+${{matrix.context.target-type}} --toolchain ${{matrix.context.tool}} --packs
    - name: Upload ${{matrix.context.tool}} output for context ${{matrix.context.proj}}.${{matrix.context.build-type}}+${{matrix.context.target-type}}
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.context.artf_name}}
        path: ${{matrix.context.dir}}/out/${{matrix.context.proj}}/${{matrix.context.target-type}}
        include-hidden-files: true
